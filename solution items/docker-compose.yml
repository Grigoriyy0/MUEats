name: "mueats"

networks:
  public-net:
    driver: bridge
  internal-net:
    internal: true

volumes:
  grafana-storage: {}
  redis-data:
    driver: local
  core-postgres-data:
  restaurants-postgres-data:
  discounts-postgres-data:
  identity-postgres-data:
  zookeeper-data:
  kafka-data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
    networks:
      - internal-net

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    restart: on-failure
    container_name: kafka
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - internal-net

  init-kafka:
    image: confluentinc/cp-kafka:7.3.2
    restart: on-failure
    depends_on:
      - kafka
    networks:
      - internal-net
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # Ждем готовности Kafka
      cub kafka-ready -b kafka:19092 1 30

      echo 'Creating kafka topics...'
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.accepted --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.prepared --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.created --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.rejected --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic orders.cancelled --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic fooditems.deleted --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic restaurants.deleted --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic roles.deleted --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:19092 --create --if-not-exists --topic roles.updated --replication-factor 1 --partitions 1
      "

  kowl:
    image: quay.io/cloudhut/kowl:v1.4.0
    restart: on-failure
    volumes:
      - ./kowl_config:/etc/kowl/
    ports:
      - "8087:8080" # Оставлен для отладки UI Kafka
    entrypoint: ./kowl --config.filepath=/etc/kowl/config.yaml
    depends_on:
      - kafka
    networks:
      - internal-net
      - public-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - internal-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - internal-net
      - public-net

  redis:
    image: redis:7-alpine
    container_name: mueats.redis
    volumes:
      - redis-data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-your_password_here} --appendonly yes
    restart: unless-stopped
    networks:
      - internal-net

  core-postgres:
    image: postgres:16-alpine
    container_name: mueats.core.postgres
    environment:
      POSTGRES_USER: ${CORE_DB_USER:-core-user}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-corepassword}
      POSTGRES_DB: postgres
    volumes:
      - core-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${CORE_DB_USER:-core-user} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal-net

  restaurants-postgres:
    image: postgres:16-alpine
    container_name: mueats.restaurants.postgres
    environment:
      POSTGRES_USER: ${RESTAURANTS_DB_USER:-restaurants-user}
      POSTGRES_PASSWORD: ${RESTAURANTS_DB_PASSWORD:-restaurantspassword}
      POSTGRES_DB: postgres
    volumes:
      - restaurants-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${RESTAURANTS_DB_USER:-restaurants-user} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal-net

  discounts-postgres:
    image: postgres:16-alpine
    container_name: mueats.discounts.postgres
    environment:
      POSTGRES_USER: ${DISCOUNTS_DB_USER:-discounts-user}
      POSTGRES_PASSWORD: ${DISCOUNTS_DB_PASSWORD:-discountspassword}
      POSTGRES_DB: postgres
    volumes:
      - discounts-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DISCOUNTS_DB_USER:-discounts-user} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal-net

  identity-postgres:
    image: postgres:16-alpine
    container_name: mueats.identity.postgres
    environment:
      POSTGRES_USER: ${IDENTITY_DB_USER:-identity-user}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD:-identitypassword}
      POSTGRES_DB: postgres
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${IDENTITY_DB_USER:-identity-user} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal-net

  core-api:
    build:
      context: ..
      dockerfile: ./src/core/MUEats.Api/Dockerfile
    container_name: mueats.core
    restart: unless-stopped
    depends_on:
      core-postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=mueats.core.postgres;Port=5432;Username=${CORE_DB_USER:-core-user};Password=${CORE_DB_PASSWORD:-corepassword};Database=postgres"
    networks:
      - internal-net

  discounts-api:
    build:
      context: ..
      dockerfile: ./src/discounts/MUEats.Discounts.Api/Dockerfile
    container_name: mueats.discounts
    restart: unless-stopped
    depends_on:
      discounts-postgres:
        condition: service_healthy
    environment:
      # Исправлен Host и имя БД
      ConnectionStrings__Postgres: "Host=mueats.discounts.postgres;Port=5432;Username=${DISCOUNTS_DB_USER:-discounts-user};Password=${DISCOUNTS_DB_PASSWORD:-discountspassword};Database=postgres"
    networks:
      - internal-net

  restaurants:
    build:
      context: ..
      dockerfile: ./src/restaurants/MUEats.Restaurants.Api/Dockerfile
    container_name: mueats.restaurants
    restart: unless-stopped
    depends_on:
      restaurants-postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: "Host=mueats.restaurants.postgres;Port=5432;Username=${RESTAURANTS_DB_USER:-restaurants-user};Password=${RESTAURANTS_DB_PASSWORD:-restaurantspassword};Database=postgres"
      ConnectionStrings__Redis: "mueats.redis:6379,password=${REDIS_PASSWORD:-your_password_here}"
    networks:
      - internal-net

  identity-api:
    build:
      context: ..
      dockerfile: ./src/identity/MUEats.Identity.Api/Dockerfile
    container_name: mueats.identity
    restart: unless-stopped
    depends_on:
      identity-postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=mueats.identity.postgres;Port=5432;Username=${IDENTITY_DB_USER:-identity-user};Password=${IDENTITY_DB_PASSWORD:-identitypassword};Database=postgres"
    networks:
      - internal-net

  gateway:
    build:
      context: ..
      dockerfile: ./src/gateway/MUEats.Gateway/Dockerfile
    container_name: mueats.gateway
    ports:
      - '5556:5000' 
    restart: unless-stopped
    depends_on:
      - core-api
      - restaurants
      - discounts-api
      - identity-api
    environment:
      ReverseProxy__Clusters__api_cluster__Destinations__destination1__Address: "http://mueats.core:8080"
      ReverseProxy__Clusters__restaurants_cluster__Destinations__destination1__Address: "http://mueats.restaurants:8080"
      ReverseProxy__Clusters__discounts_cluster__Destinations__destination1__Address: "http://mueats.discounts:8080"
    networks:
      - public-net
      - internal-net